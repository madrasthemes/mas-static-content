# Dependabot is used for security updates only, batched into one PR per
# ecosystem. `open-pull-requests-limit: 0` turns off routine version-update
# PRs; security update PRs are not affected by that limit.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 0
    groups:
      composer-security:
        applies-to: security-updates
        patterns:
          - "*"
